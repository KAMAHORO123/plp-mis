server {
 listen 80;
 root /usr/share/nginx/html;
 index index.html;
 # The gateway routes /api to the platform service; everything else is the single-page Hub.
 location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
 location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
 location /images/ { try_files $uri =404; expires 7d; }
}
