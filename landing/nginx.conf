server {
 listen 80;
 root /usr/share/nginx/html;
 index index.html;
 # Browsers re-check the page on every visit, so a rebuild shows up immediately.
 location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
 location /images/ { try_files $uri =404; }
 location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
 location = /announcement.json { add_header Cache-Control "no-cache"; }
}
